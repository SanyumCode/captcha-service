name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Package
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
